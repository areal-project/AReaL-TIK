name: Release checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  cpu-and-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whitespace check needs HEAD's parent to identify this commit's changes.
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install CPU check dependency
        run: python -m pip install PyYAML
      - name: Check evaluator and public interface
        run: python -B -m unittest discover -s tests -v
      - name: Verify sources, original evidence and figure aggregates
        run: python -B tools/verify_archive.py
      - name: Check maintained-file whitespace
        # Archived CUDA bytes are checked by verify_archive.py and must remain unchanged.
        run: git show --format= --check HEAD -- . ':(exclude,glob)experimental/*/kernels/**'
