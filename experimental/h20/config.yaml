schema_version: 1
gpu:
  name: H20
  compute_capability:
  - 9
  - 0
  cuda_arch: 90a
kernel:
  source: kernels/unified_attn_ext.cu
  snapshot: kernels/snapshots/g6_17_combined_current_stream.cu
  sha256: 942b8bf9f739b3c6825a28b6914ad6bed83160dbcca71e4448f2d2a5dd2d1445
  entrypoints:
    prefill: unified_prefill
    decode: unified_decode
  manifest: kernels/manifest.json
  validation: validation.json
workload:
  dtype: bfloat16
  layout: BHSD
  contiguous: true
  causal: true
  query_heads: 32
  kv_heads: 8
  head_dim: 128
  batches:
  - 1
  - 4
  - 8
  - 16
  prefill_lengths:
  - 1024
  - 4096
  - 8192
  - 16384
  decode_context_lengths:
  - 128
  - 1024
  - 4096
  - 8192
  decode_query_length: 1
build:
  torch_cuda_arch_list: 9.0a
  cuda_flags:
  - -O3
  - -std=c++17
  - -gencode=arch=compute_90a,code=sm_90a
  - -DCUTLASS_ARCH_MMA_SM90_SUPPORTED
  cxx_flags:
  - -std=c++17
  - -DCUTLASS_ARCH_MMA_SM90_SUPPORTED
  link_flags:
  - -lcuda
  cutlass_include_env: CUTLASS_INCLUDE_DIR
  fast_math: false
baselines:
  prefill: FlashAttention-3
  decode: FlashInfer; fastest numerically qualified screened variant per shape
  hopper_fa3_tensor_core_comparison: true
  selection_note: Screen backend, CUDA/Tensor Core mode, layout, PDL, and graph planning; do not assume
    the default is fastest.
correctness:
  internal_check: Exact BF16 storage-bit equality on recorded cases; scoped to validation.json
  prior_source_bits: Preserved on the recorded comparison grid.
  external_final_grid_max_abs_less_than: 0.05
  external_bitwise_equality_required: false
  cross_gpu_bitwise_equality_claimed: false
  backward_in_scope: false
  validation_origin: Archived GPU runs; no GPU tests performed while packaging.
recorded_timing:
  boundary: Matched grouped CUDA-graph replay for all compared implementations
  alternating_rounds: 3
  max_calls_per_graph: 32
  graph_output_size_budget_bytes: 268435456
  excludes:
  - compilation
  - warmup
  - graph capture
  - FlashInfer planning
  - KV cache packing
  scope: Standalone forward attention; not end-to-end layer or RL throughput.
